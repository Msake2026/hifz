<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#1d2a24; --muted:#6a766f; --line:#e3dac8;
  --accent:#0f6b4f; --accent-ink:#fff; --ok:#1c8a5a; --okbg:#dff3e7; --ko:#b8392f; --kobg:#f9e1de; --mid:#b7791f; --midbg:#faefd6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1714; --card:#17231e; --ink:#e8efe9; --muted:#93a39a; --line:#27382f;
  --accent:#4cc79b; --accent-ink:#06261b; --ok:#5fd6a0; --okbg:#173a2b; --ko:#ff8d82; --kobg:#401f1c; --mid:#f0b95a; --midbg:#3d311a;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:.2em 0}
h2{font-size:1.05rem;margin:0 0 .6em}
.sub{color:var(--muted);margin:0 0 1.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
select,input[type=number],input[type=text],input[type=time],textarea,.blankin{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.big{width:100%;padding:14px;font-size:1.05rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{text-align:left;padding:12px}
.mode b{display:block}
.mode small{color:var(--muted)}
.mode.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:110px}.seg button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ar{font-family:"Amiri Quran","Traditional Arabic",serif;direction:rtl;text-align:right;font-size:1.9rem;line-height:2.3;padding:6px 2px}
.ref{color:var(--muted);font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px dashed var(--accent);color:transparent;cursor:pointer;user-select:none;margin:0 .15em}
.blank.rev{color:var(--accent);border-bottom-style:solid}
.blankin{display:inline-block;width:6.5em;padding:2px 6px;font:inherit;font-family:"Amiri Quran",serif;font-size:1.5rem;direction:rtl;margin:0 .15em}
.w-ok{color:var(--ok)} .w-ko{color:var(--ko);text-decoration:underline wavy}
.wd{cursor:pointer;border-radius:6px;padding:0 2px}.wd:hover{background:var(--line)}.wd.bad{color:var(--ko);text-decoration:underline wavy}
sup.vn{font-family:Inter,sans-serif;font-size:.6rem;color:var(--muted);margin:0 3px}
.opt{display:block;width:100%;margin:8px 0;text-align:right;padding:10px 14px}
.opt.ar{font-size:1.45rem;line-height:2}
.opt.c{background:var(--okbg);border-color:var(--ok)} .opt.w{background:var(--kobg);border-color:var(--ko)}
.fb{padding:10px 14px;border-radius:10px;margin:12px 0}
.fb.ok{background:var(--okbg)} .fb.ko{background:var(--kobg)} .fb.mid{background:var(--midbg)}
.grades{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.grades button{flex:1;min-width:110px}
.stat{display:flex;gap:10px}.stat div{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.4rem}
.weak{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.big-score{font-size:3rem;font-weight:600;text-align:center;margin:.2em 0}
.foot{color:var(--muted);font-size:.78rem;text-align:center;margin-top:24px}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}
.kbd{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.kbd button{min-width:44px;font-size:1.4rem;padding:2px 10px;font-family:"Amiri Quran",serif}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sib{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.sib .ar{font-size:1.3rem;line-height:2}
/* carte de progression */
.grid{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:34px;height:30px;padding:0;font-size:.72rem;border-radius:6px;background:var(--line);color:var(--ink)}
.cell.sm{width:15px;height:15px;border-radius:3px;font-size:0}
.cell.l1{background:color-mix(in srgb,var(--accent) 25%,var(--card))}
.cell.l2{background:color-mix(in srgb,var(--accent) 50%,var(--card))}
.cell.l3{background:color-mix(in srgb,var(--accent) 75%,var(--card));color:var(--accent-ink)}
.cell.l4{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
.week{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.week div{flex:1;text-align:center;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.week i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:3px}
.goal{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 4px}.goal i{display:block;height:100%;background:var(--accent)}
details summary{cursor:pointer;font-weight:600}
details textarea{min-height:120px;margin-top:6px}
/* menu d'application */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{display:flex;max-width:720px;margin:0 auto}
#nav button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:.68rem;color:var(--muted);position:relative}
#nav button.sel{color:var(--accent);font-weight:600}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--ko);color:#fff;border-radius:10px;font-size:.62rem;line-height:1;padding:3px 5px;font-weight:600}
body.has-nav main{padding-bottom:96px}
.cta{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));padding:10px 0 4px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.grid.named{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.cell.named{width:auto;height:auto;padding:5px 6px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.2}
.cell.named b{font-size:.85rem}.cell.named small{font-size:.68rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
/* lecteur */
.rd{font-family:"Amiri Quran","Traditional Arabic",serif;direction:rtl;text-align:justify;line-height:2.5;padding:4px 2px}
.rv{border-radius:8px;transition:background .2s}
.rv.hid{filter:blur(9px);cursor:pointer;user-select:none}
.rv.playing,.rv.focus{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.vend{color:var(--accent);font-size:.8em;white-space:nowrap}
.pl{display:flex;gap:10px;align-items:baseline;justify-content:flex-start;padding:2px 4px;border-bottom:1px solid var(--line)}
.pl .psep{color:var(--accent);font-size:.7em;flex:none}.pl .pn,.pp .pn{font-family:Inter,sans-serif;font-size:.65rem;color:var(--muted);flex:none;min-width:1.6em;text-align:center}
.pp{padding:4px;border-bottom:1px solid var(--line)}
.hero{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.hero .logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:"Amiri Quran",serif;font-size:1.3rem}
.hero h1{margin:0;line-height:1.1}.hero p{margin:0;color:var(--muted);font-size:.9rem}
.sumline{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.sumline span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem}
.list-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-top:8px}
</style>

<body>
<script src="moutoun.js"></script>
<script src="mutashabihat.js"></script>
<script src="config.js"></script>
<main id="app"><p class="sub">Chargement du texte du Coran…</p></main>
<nav id="nav" hidden aria-label="Menu principal"></nav>

<script>
/* ---------- utilitaires ---------- */
const $app = document.getElementById('app');
const $ = id => document.getElementById(id);
let cloudDirty = () => {}; // branché plus bas : envoie la progression au compte quand elle change
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} cloudDirty(k); }
};
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Normalisation arabe (mode souple) : on ignore voyelles, signes coraniques, variantes d'alif/ya/ta marbuta */
const norm = w => w
  .replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ࣓-ࣿ﻿]/g, '')
  .replace(/[إأآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
  .replace(/[^ء-ي]/g, '');
function lev(a, b){
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
/* Orthographe uthmani ≠ courante (ex. الصلوة / الصلاة) : tolérance d'une lettre sur les mots longs (souple et moutoun) */
const same = (a, b) => a === b || (a.length >= 5 && b.length >= 5 && lev(a, b) <= 1);
/* Correction stricte/standard : lettres + voyelles (fatha, damma, kasra, soukoun, chadda, tanwin) exactes.
   Toujours toléré (orthographe, pas mémoire) : signes de récitation, tatwil, madda, alif de prolongation (ٰ / ا / وٰ),
   alif wasla ٱ = ا, ى = ي.
   Niveau « standard » en plus : soukoun ignoré et chadda ignorée sur la 1re lettre d'un mot (assimilation / idghām,
   que l'écriture courante ne note pas comme l'uthmani). */
function skey(w, tol){
  let t = w.replace(/ۡ/g, 'ْ').replace(/[وي]ٰ/g, '').replace(/ٱ/g, 'ا').replace(/ى/g, 'ي').replace(/آ/g, 'ءَا')
    .replace(/[^ء-يً-ْ]/g, '');
  if (tol) t = t.replace(/ْ/g, '').replace(/^(.[ً-ْ]*)/, m => m.replace(/ّ/g, ''));
  t = t.replace(/[ً-ْ]+/g, m => [...m].sort().join(''));
  return t ? t[0] + t.slice(1).replace(/ا(?![ً-ْ])/g, '') : '';
}
const ck = w => skey(w, cfg.corr === 'standard');
function tokenize(text){
  const tok = text.replace(/﻿/g, '').trim().split(/\s+/);
  const nw = tok.map(norm);
  const idx = nw.map((w, i) => w ? i : -1).filter(i => i >= 0);
  return {tok, nw, idx, sk: tok.map(ck)};
}
function splitPoint(words){ // prose : coupe près du milieu, de préférence après une ponctuation
  const n = words.length; let best = null;
  for (let i = Math.floor(n * .35); i <= Math.floor(n * .65); i++)
    if (i && /[،:؛.؟"”]$/.test(words[i - 1]) && (best === null || Math.abs(i - n / 2) < Math.abs(best - n / 2))) best = i;
  return best || Math.ceil(n / 2);
}

/* ---------- données ---------- */
let Q = null; // [{n, ar, en, a:[{t, j, p}]}]
let MT = {};  // moutoun : id -> {ar, fr, author, kind, unit, source, a:[{t, m}]}
let custom = store.get('hifz.custom', []); // moutoun ajoutés par l'utilisateur
const MS = (window.MUTASHABIHAT && window.MUTASHABIHAT.pairs) || {}; // versets proches (calculés)
let OFF = [], PAGE_LEN = [];
const isQ = s => typeof s === 'number';
const book = s => isQ(s) ? Q[s - 1] : MT[s];
const pk = k => { const [s, a] = k.split(':'); return {s: /^\d+$/.test(s) ? +s : s, a: +a}; };
const CACHE_KEY = 'hifz.quran.v2';
async function loadQuran(){
  Q = store.get(CACHE_KEY, null);
  if (!(Q && Q.length === 114)){
    const r = await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const surahs = (await r.json()).data.surahs;
    Q = surahs.map(s => ({
      n: s.number, ar: s.name, en: s.englishName,
      a: s.ayahs.map((v, i) => {
        let t = v.text.replace(/﻿/g, '').trim();
        // l'API préfixe la basmala au verset 1 (sauf sourates 1 et 9) : on la retire
        if (i === 0 && s.number !== 1 && s.number !== 9) t = t.split(/\s+/).slice(4).join(' ');
        return {t, j: v.juz, p: v.page};
      })
    }));
    store.set(CACHE_KEY, Q);
  }
  let n = 0; OFF = Q.map(s => { const o = n; n += s.a.length; return o; });
  PAGE_LEN = new Array(605).fill(0); Q.forEach(s => s.a.forEach(v => PAGE_LEN[v.p]++));
}

/* ---------- état persistant ---------- */
const DEF = {mode: 'mix', scope: {type: 'surah', from: 78, to: 114}, n: 10, input: 'recite', level: 40,
  corr: 'standard', show: {s: true, v: true, p: true}, reciter: 'ar.alafasy', goal: 20, contLen: 5, endLen: 2, begLen: 1, map: 's', tab: 'home', rdHide: false, rdSize: 1.9};
const stored = store.get('hifz.cfg', {});
let cfg = Object.assign({}, DEF, stored);
if (stored.strict === false && !stored.corr) cfg.corr = 'soft';   // ancien réglage
if (stored.strict === true && !stored.corr) cfg.corr = 'strict';
let stats = store.get('hifz.stats', {}); // "s:a" -> [ok, ko]
let errors = store.get('hifz.errors', []); // journal : {t, k, m, sc, ans?, bad?[]}
let sched = store.get('hifz.sched', {}); // "s:a" -> {iv: jours, due: timestamp}
let days = store.get('hifz.days', {});   // "AAAA-MM-JJ" -> nb de réponses
const saveCfg = () => store.set('hifz.cfg', cfg);
const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const key = r => r.s + ':' + r.a;
const verse = r => book(r.s).a[r.a - 1].t;
const slen = s => book(s).a.length;
const sname = s => isQ(s) ? `${Q[s-1].en} · ${Q[s-1].ar}` : `${MT[s].fr} · ${MT[s].ar}`;
const rlabel = r => isQ(r.s) ? `Sourate ${r.s} – ${Q[r.s-1].en}, verset ${r.a} · page ${Q[r.s-1].a[r.a-1].p}`
  : `${MT[r.s].fr}, ${MT[r.s].unit} ${r.a}`;
function record(r, score){
  const [ok, ko] = stats[key(r)] || [0, 0];
  stats[key(r)] = [ok + score, ko + (1 - score)];
  store.set('hifz.stats', stats);
  // répétition espacée : réussite → intervalle ×2,2 ; hésitation → inchangé ; raté → à revoir dans 6 h
  const k = key(r), prev = sched[k]?.iv || 0;
  const iv = score === 1 ? (prev ? prev * 2.2 : 1) : score >= 0.5 ? Math.max(prev, 1) : 0.25;
  sched[k] = {iv, due: Date.now() + iv * 864e5};
  store.set('hifz.sched', sched);
  days[today()] = (days[today()] || 0) + 1;
  store.set('hifz.days', days);
}
const dueRefs = () => Object.entries(sched).filter(([, v]) => v.due <= Date.now())
  .sort((a, b) => a[1].due - b[1].due).map(([k]) => pk(k)).filter(r => book(r.s));
function streak(){
  let n = 0; const d = new Date();
  if (!days[today(d)]) d.setDate(d.getDate() - 1);
  while (days[today(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function buildPool(sc){
  const p = [];
  if (sc.type === 'matn'){
    for (const id of Object.keys(MT)) if (sc.id === 'all' || sc.id === id) MT[id].a.forEach((_, i) => p.push({s: id, a: i + 1}));
    return p;
  }
  for (const S of Q){
    if (sc.type === 'surah' && (S.n < sc.from || S.n > sc.to)) continue;
    S.a.forEach((v, i) => {
      if (sc.type === 'juz' && (v.j < sc.from || v.j > sc.to)) return;
      if (sc.type === 'page' && (v.p < sc.from || v.p > sc.to)) return;
      p.push({s: S.n, a: i + 1});
    });
  }
  return p;
}
function pickWeighted(list){
  const w = list.map(r => {
    const [ok, ko] = stats[key(r)] || [0, 0];
    return (ok + ko) === 0 ? 2 : 0.3 + 3 * ko / (ok + ko);
  });
  let x = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++){ x -= w[i]; if (x <= 0) return list[i]; }
  return list[list.length - 1];
}

/* ---------- audio (récitation verset par verset : cdn.islamic.network / AlQuran Cloud) ---------- */
const RECITERS = [['ar.alafasy', 'Mishary Alafasy', 128], ['ar.husary', 'Al-Husary', 128], ['ar.husarymujawwad', 'Al-Husary (mujawwad)', 128],
  ['ar.mahermuaiqly', 'Maher Al-Muaiqly', 128], ['ar.hudhaify', 'Al-Hudhaify', 128], ['ar.muhammadayyoub', 'Muhammad Ayyoub', 128],
  ['ar.abdurrahmaansudais', 'Abdurrahmaan As-Sudais', 64], ['ar.saoodshuraym', 'Saood Ash-Shuraym', 64]];
const audioUrl = r => {
  const rc = RECITERS.find(x => x[0] === cfg.reciter) || RECITERS[0];
  return `https://cdn.islamic.network/quran/audio/${rc[2]}/${rc[0]}/${OFF[r.s - 1] + r.a}.mp3`;
};
const player = new Audio();
let playQ = [], playDone = null;
function playUrls(urls, done){
  stopAudio(); playQ = urls.slice(); playDone = done || null; step();
}
function step(){
  if (!playQ.length){ const d = playDone; playDone = null; if (d) d(); return; }
  player.src = playQ.shift();
  player.play().catch(() => { playQ = []; const m = $('audio-msg'); if (m) m.textContent = 'Audio indisponible (connexion ?).'; });
}
player.onended = step;
function stopAudio(){ playQ = []; playDone = null; try { player.pause(); } catch {} }
const audioHtml = () => (cur && cur.audio && cur.audio.length && isQ(cur.audio[0].s))
  ? `<div class="grades"><button data-act="play">🔊 Écouter (${(RECITERS.find(x => x[0] === cfg.reciter) || RECITERS[0])[1]})</button><button data-act="stopaudio" style="flex:0 0 auto;min-width:0">⏹</button></div><p class="ref" id="audio-msg"></p>` : '';

/* ---------- écran d'accueil ---------- */
const MODES = [
  ['mix',    'Mélange',            'Tous les exercices'],
  ['next',   'Verset suivant',     'Donne la suite du verset'],
  ['cloze',  'Mots manquants',     'Complète le verset'],
  ['which',  'Quelle sourate ?',   'Identifie d\'où vient le verset'],
  ['mcq',    'Suite en QCM',       'Choisis le bon verset suivant'],

function opts(n, sel){ let h = ''; for (let i = 1; i <= n; i++) h += `<option value="${i}" ${i === sel ? 'selected' : ''}>${i}</option>`; return h; }
function surahOpts(sel){ return Q.map(s => `<option value="${s.n}" ${s.n === sel ? 'selected' : ''}>${s.n}. ${s.en}</option>`).join(''); }
function srcNote(sc){

/* progression par sourate / page / matn */
function levelOf(e, len){
  if (!e) return 0;
  const m = (e.ok / ((e.ok + e.ko) || 1)) * (e.seen / len);
  return m < .15 ? 1 : m < .4 ? 2 : m < .7 ? 3 : 4;
}
function mapHtml(){
  const by = {}; // id -> {seen, ok, ko}
  for (const [k, [ok, ko]] of Object.entries(stats)){
    const r = pk(k); if (!book(r.s)) continue;
    const id = cfg.map === 'p' ? (isQ(r.s) ? Q[r.s-1].a[r.a-1].p : null) : cfg.map === 's' ? (isQ(r.s) ? r.s : null) : (isQ(r.s) ? null : r.s);
    if (id === null) continue;
    const e = (by[id] ||= {seen: 0, ok: 0, ko: 0}); e.seen++; e.ok += ok; e.ko += ko;
  }
  const tabs = `<div class="seg" style="margin-bottom:10px">${[['s', 'Sourates'], ['p', 'Pages'], ['m', 'Moutoun']]
    .map(([k, t]) => `<button class="${cfg.map === k ? 'sel' : ''}" data-act="maptab" data-v="${k}">${t}</button>`).join('')}</div>`;
  let body;
  if (cfg.map === 's') body = Q.map(S => { const lv = levelOf(by[S.n], S.a.length), e = by[S.n];
    return `<button class="cell named l${lv}" data-act="cell" data-v="${S.n}" title="${S.n}. ${S.en}${e ? ' · ' + Math.round(100 * e.ok / (e.ok + e.ko)) + ' % · ' + e.seen + '/' + S.a.length + ' versets vus' : ''}"><b>${S.n}</b><small>${esc(S.en)}</small></button>`; }).join('');
  else if (cfg.map === 'p') body = Array.from({length: 604}, (_, i) => { const p = i + 1, lv = levelOf(by[p], PAGE_LEN[p] || 1);
    return `<button class="cell sm l${lv}" data-act="pcell" data-v="${p}" title="page ${p}"></button>`; }).join('');
  else body = Object.values(MT).map(t => { const e = by[t.id], lv = levelOf(e, t.a.length);
    return `<div class="weak" style="width:100%"><span>${esc(t.fr)}</span><span>${e ? Math.round(100 * e.ok / (e.ok + e.ko)) + ' % · ' + e.seen + '/' + t.a.length : 'pas commencé'}</span></div>`; }).join('');
  return `${tabs}<div class="grid${cfg.map === 's' ? ' named' : ''}">${body}</div>
    <div class="legend">pas vu <i class="cell" style="width:14px;height:14px"></i><i class="cell l1" style="width:14px;height:14px"></i><i class="cell l2" style="width:14px;height:14px"></i><i class="cell l3" style="width:14px;height:14px"></i><i class="cell l4" style="width:14px;height:14px"></i> maîtrisé</div>
    <p class="ref" style="margin:4px 0 0">Maîtrise = réussite × part des versets déjà vus.${cfg.map === 'm' ? '' : ' Touche une case pour réviser.'}</p>`;
}
function weekHtml(){
  const out = [], names = ['D', 'L', 'M', 'M', 'J', 'V', 'S']; let tot = 0, act = 0;
  for (let i = 6; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const n = days[today(d)] || 0; tot += n; if (n) act++; out.push([names[d.getDay()], n]); }
  const mx = Math.max(cfg.goal, ...out.map(x => x[1]));
  return `<div class="week">${out.map(([l, n]) => `<div title="${n} réponses"><i style="height:${Math.round(70 * n / mx)}px"></i>${l}</div>`).join('')}</div>
    <p class="ref" style="margin:4px 0 0">7 derniers jours : ${tot} réponses, ${act} jour${act > 1 ? 's' : ''} actif${act > 1 ? 's' : ''}.</p>`;
}

function syncCfg(){
  const v = id => $(id) ? $(id).value : null;
  if ($('stype')){
    const isM = cfg.scope.type === 'matn', t = isM ? 'matn' : v('stype');
    if (t === 'matn'){ cfg.scope = {type: 'matn', id: v('smatn') || 'all'}; }
    else {
      let f = +v('sfrom'), e = +v('sto');
      if (t !== cfg.scope.type){ [f, e] = {surah: [78, 114], juz: [30, 30], page: [582, 604], all: [1, 114]}[t]; }
      if (f > e) [f, e] = [e, f];
      cfg.scope = {type: t, from: f || 1, to: e || 114};
    }
  }
  if ($('sn')) cfg.n = +v('sn');
  if ($('slevel')) cfg.level = +v('slevel');
  if ($('scont')) cfg.contLen = +v('scont');
  if ($('send')) cfg.endLen = +v('send');

}

function tabProgress(){
  const tot = Object.values(stats).reduce((a, [o, k]) => [a[0] + o, a[1] + k], [0, 0]), answered = tot[0] + tot[1];
  const per = {};
  for (const [k, [o, ko]] of Object.entries(stats)){ const s = k.split(':')[0]; if (!book(pk(k).s)) continue; (per[s] ||= [0, 0]); per[s][0] += o; per[s][1] += ko; }
  const weak = Object.entries(per).filter(([, [o, k]]) => o + k >= 3)
    .map(([s, [o, k]]) => [s, o / (o + k), o + k]).sort((a, b) => a[1] - b[1]).slice(0, 5);
  return `
  <h1>Progrès</h1>
  <p class="sub">Où tu en es, sourate par sourate.</p>
  <div class="card">${answered ? `<div class="stat"><div><b>${Math.round(answered)}</b>réponses</div>
    <div><b>${Math.round(100 * tot[0] / answered)} %</b>réussite</div>
    <div><b>${Object.keys(stats).length}</b>versets vus</div></div>`
    : `<p class="sub" style="margin:0">Pas encore de statistiques : fais ta première série.</p>`}</div>
  <div class="card"><h2>Cette semaine</h2>${weekHtml()}</div>
  <div class="card"><h2>Carte de progression</h2>${mapHtml()}</div>
  ${weak.length ? `<div class="card">${weakHtml(weak)}</div>` : ''}`;
}

    <div class="row" style="margin-top:12px;align-items:end"><div><label class="f">Rappel quotidien (calendrier)</label><input type="time" id="rtime" value="20:00"></div>
      <button data-act="ics">📅 Ajouter au calendrier</button></div>
  </div>

  <div class="card"><h2>Mes données</h2>
    <div class="row"><button data-act="export">⬇ Exporter ma progression</button><button data-act="import">⬆ Importer</button></div>
    <input type="file" id="impfile" accept="application/json,.json" hidden>
    <p class="ref" style="margin:8px 0 0">Tout est stocké sur cet appareil. Exporte régulièrement pour ne rien perdre en changeant de téléphone.</p>
    <p style="margin:6px 0 0"><button class="link" data-act="reset" style="color:var(--ko)">Réinitialiser statistiques et historique</button></p>
  </div>

  <div class="card"><h2>Application</h2>
    <p class="ref" style="margin:0 0 8px">Version ${APP_VERSION}. Une fois installée sur le téléphone, l'application se met à jour toute seule à l'ouverture quand tu es en ligne ; si tu ne vois pas les nouveautés, utilise ce bouton (ta progression n'est pas touchée).</p>
    <button data-act="upd">🔄 Chercher les mises à jour</button></div>

  <div class="card"><h2>Sources</h2>
    <p class="ref" style="margin:0">Coran : texte uthmani du projet Tanzil via api.alquran.cloud (lecture de Ḥafṣ). Audio : cdn.islamic.network (AlQuran Cloud). Moutoun : Wikisource arabe et hadith-api (voir l'écran Réviser pour chaque matn). Versets proches : calculés automatiquement.</p>
  </div>`;
}
const weakHtml = weak => weak.length ? `<h2 style="margin-top:14px">À retravailler</h2>` + weak.map(([s, r, n]) =>
  `<div class="weak"><span>${sname(pk(s + ':1').s)}</span><span>${Math.round(r * 100)} % · ${Math.round(n)} rép.</span></div>`).join('') : '';

/* ---------- séance ---------- */
let ses = null, cur = null, ls = null;
function start(fixed){
  const pool = fixed || buildPool(cfg.scope);
  if (!pool.length) return alert('Aucun verset dans cette portée.');
  ses = {pool, fixed: !!fixed, i: 0, score: 0, missed: [], used: new Set(), total: fixed ? fixed.length : cfg.n};
  nextQ();
}
function shell(inner){
  setNav(false);
  $app.innerHTML = `
  <div class="top"><button class="link" data-act="home">✕ Quitter</button><span>${ses.i} / ${ses.total}</span></div>
  <div class="bar"><i style="width:${100 * (ses.i - 1) / ses.total}%"></i></div>
  <div class="card">${inner}</div>`;
}
/* versets proches */
const sibsOf = r => (MS[key(r)] || []).map(x => { const [s, a, p] = x.split(':').map(Number); return {s, a, p}; });
const nextOf = r => ({s: r.s, a: r.a + 1});
const mutashOk = r => r.a < slen(r.s) && sibsOf(r).some(x => x.a < slen(x.s) && verse(nextOf(x)) !== verse(nextOf(r)));
/* phrases (prose) */
function clausesOf(r){
  const u = book(r.s).a[r.a - 1], w = u.t.split(/\s+/), out = []; let c = [];
  if (book(r.s).kind === 'poem' && u.m) return [w.slice(0, u.m).join(' '), w.slice(u.m).join(' ')];
  for (const t of w){ c.push(t); if (/[،:؛.؟!]["”]?$/.test(t) && c.length >= 3){ out.push(c.join(' ')); c = []; } }
  if (c.length){ if (c.length < 3 && out.length) out[out.length - 1] += ' ' + c.join(' '); else out.push(c.join(' ')); }
  return out;
}
function nextQ(){
  stopAudio();
  if (ses.i >= ses.total) return results();
  ses.i++;
  const hasQ = ses.pool.some(r => isQ(r.s)), hasM = ses.pool.some(r => !isQ(r.s));
  let m = cfg.mode;
  if (m === 'mix'){
    const L = ['next', 'cloze', 'which', 'mcq'];
    if (hasQ) L.push('mutash', 'start', 'order', 'end', 'link');
    if (hasM) L.push('half', 'phrase');
    m = L[rnd(L.length)];
  }
  let cands = ses.pool.filter(r => !ses.used.has(key(r)));
  if (!cands.length){ ses.used.clear(); cands = ses.pool; }
  const only = (f, fb) => { const c = cands.filter(f); if (c.length) cands = c; else m = fb; };
  if (m === 'half') only(r => !isQ(r.s), 'cloze');
  if (m === 'phrase') only(r => !isQ(r.s) && book(r.s).kind === 'prose' && clausesOf(r).length >= 2, 'half');
  if (m === 'half') only(r => !isQ(r.s), 'cloze');
  if (m === 'mutash') only(r => isQ(r.s) && mutashOk(r), 'mcq');
  if (m === 'order') only(r => isQ(r.s) && r.s < 114, 'cloze');
  if (m === 'start') only(r => isQ(r.s) && slen(r.s) >= 2, 'cloze');
  if (m === 'next' || m === 'mcq') only(r => r.a < slen(r.s), 'cloze');
  let r;
  if (m === 'end' || m === 'link'){ // on tire une sourate, pas un verset : on pèse sur son dernier verset
    let ss = [...new Set(cands.filter(x => isQ(x.s) && (m === 'end' || x.s < 114)).map(x => x.s))];
    const fresh = ss.filter(s => !ses.used.has(s + ':' + slen(s))); if (fresh.length) ss = fresh;
    if (ss.length) r = pickWeighted(ss.map(s => ({s, a: slen(s)}))); else m = 'cloze';
  }
  if (!r) r = pickWeighted(cands);
  ses.used.add(key(r));
  cur = {m, r, done: false};
  ({next: qNext, cloze: qCloze, which: qWhich, mcq: qMcq, half: qHalf, phrase: qPhrase, mutash: qMutash, start: qStart, order: qOrder, cont: qCont, end: qEnd, link: qLink})[m]();
}
function logError(r, score, info = {}){
  const e = {t: Date.now(), k: key(r), m: cur.m, sc: score};
  if (info.ans) e.ans = String(info.ans).slice(0, 400);
  if (info.bad && info.bad.length) e.bad = info.bad.slice(0, 40);
  errors.push(e);
  if (errors.length > 2000) errors = errors.slice(-2000);
  store.set('hifz.errors', errors);
}
function finish(score, extra = ''){
  if (cur.done) return; cur.done = true;
  if (cur.perRef) cur.perRef.forEach(([x, sc], v) => { if (x.bas) return; record(x, sc); if (sc < 1){ ses.missed.push(x); logError(x, sc, {bad: cur.badV && cur.badV[v]}); } });
  else { record(cur.r, score); if (score < 1){ ses.missed.push(cur.r); logError(cur.r, score, cur.info); } }
  ses.score += score;
  const cls = score === 1 ? 'ok' : score >= 0.5 ? 'mid' : 'ko';
  const label = score === 1 ? 'Excellent ✓' : score >= 0.5 ? 'Presque' : 'À revoir';
  $('fb').innerHTML =
    `<div class="fb ${cls}"><b>${label}</b> · <span class="ref">${cur.label || rlabel(cur.r)}</span>${extra}</div>${audioHtml()}
     <button class="pri big" style="margin-top:8px" data-act="nextq">${ses.i >= ses.total ? 'Voir le résultat' : 'Question suivante'}</button>`;
}
const gradeUI = () => `<div class="grades">
  <button data-act="grade" data-v="1">✓ Je savais</button>
  <button data-act="grade" data-v="0.5">~ J'ai hésité</button>
  <button data-act="grade" data-v="0">✗ Raté</button></div>`;

/* indices affichés avec la question, selon les réglages */
function qref(r){
  const sh = cfg.show, p = [];
  if (isQ(r.s)){
    if (sh.s) p.push(`Sourate ${r.s} – ${Q[r.s-1].en}`);
    if (sh.v) p.push(`verset ${r.a}`);
    if (sh.p) p.push(`page ${Q[r.s-1].a[r.a-1].p}`);
  } else {
    if (sh.s) p.push(MT[r.s].fr);
    if (sh.v) p.push(`${MT[r.s].unit} ${r.a}`);
  }
  return p.length ? `<p class="ref">${p.join(' · ')}</p>` : '';
}
const useStrict = () => isQ(cur.r.s) && cfg.corr !== 'soft';
const kbd = () => useStrict() && cfg.input === 'type'
  ? `<div class="kbd">${['َ', 'ُ', 'ِ', 'ْ', 'ّ', 'ً', 'ٌ', 'ٍ'].map(c => `<button data-act="ins" data-v="${c}">◌${c}</button>`).join('')}</div>` : '';

/* texte attendu : une ou plusieurs unités (versets), aplati en mots */
function setExpected(units){
  cur.units = units;
  cur.flat = [];
  units.forEach((u, v) => { const T = tokenize(u.text);
    T.tok.forEach((w, i) => cur.flat.push({w, v, first: i === 0, ok: !!T.nw[i], nw: T.nw[i], sk: T.sk[i]})); });
}
function workUI(l = {}){
  const rev = l.rev || 'Révéler la suite', voice = l.voice || '🎤 Réciter la suite', ph = l.ph || 'اكتب التكملة…', rows = l.rows || 3;
  return cfg.input === 'type'
    ? `<textarea id="ans" dir="rtl" lang="ar" rows="${rows}" placeholder="${ph}"></textarea>${kbd()}
       <button class="pri" style="margin-top:8px" data-act="check">Vérifier</button>`
    : cfg.input === 'voice' && SR
    ? `<button class="pri big" data-act="listen">${voice}</button><p class="ref" id="heard"></p>
       <button class="link" data-act="reveal">Je préfère m'auto-évaluer</button>`
    : `<button class="pri big" data-act="reveal">${rev}</button>`;
}
function flatHtml(mark){ // mark(x, i) -> classe ou ''
  const multi = cur.units.length > 1;
  return cur.flat.map((x, i) => {
    const sep = multi && x.first && cur.refs && x.v > 0 && cur.refs[x.v].s !== cur.refs[x.v - 1].s
      ? `<br><span class="ref">— ${esc(sname(cur.refs[x.v].s))} —</span><br>` : '';
    const vn = multi && x.first ? `<sup class="vn">${cur.refs ? (cur.refs[x.v].bas ? 'basmala' : cur.refs[x.v].a) : x.v + 1}</sup>` : '';
    return sep + vn + (x.ok ? mark(x, i) : esc(x.w));
  }).join(' ');
}

/* 1. Verset suivant */
function qNext(){
  const {r} = cur;
  setExpected([{text: verse(nextOf(r))}]);
  cur.audio = [r, nextOf(r)];
  shell(`<p class="ref">${isQ(r.s) ? 'Quel est le verset qui suit ?' : 'Quelle est la suite ?'}</p>
    <div class="ar">${esc(verse(r))}</div>${qref(r)}
    <div id="work">${workUI()}</div><div id="fb"></div>`);
}
function qHalf(){ // moutoun : première moitié donnée, on complète la seconde
  const {r} = cur, w = verse(r).split(/\s+/), m = book(r.s).a[r.a - 1].m || Math.ceil(w.length / 2);
  setExpected([{text: w.slice(m).join(' ')}]);
  shell(`<p class="ref">Complète la seconde moitié.</p>
    <div class="ar">${esc(w.slice(0, m).join(' '))} …</div>${qref(r)}
    <div id="work">${workUI()}</div><div id="fb"></div>`);
}
function qPhrase(){ // prose : on donne la phrase précédente, on complète la suivante
  const {r} = cur, C = clausesOf(r), k = 1 + rnd(C.length - 1);
  setExpected([{text: C[k]}]);
  cur.label = `${rlabel(r)} (partie ${k + 1}/${C.length})`;
  shell(`<p class="ref">Quelle est la phrase suivante ?</p>
    <div class="ar">${esc(C.slice(Math.max(0, k - 2), k).join(' '))} …</div>${qref(r)}
    <div id="work">${workUI()}</div><div id="fb"></div>`);
}
function qStart(){ // début de sourate
  const {r} = cur, first = {s: r.s, a: 1};
  cur.r = first; cur.audio = [first];
  setExpected([{text: verse(first)}]);
  shell(`<p class="ref">Quel est le premier verset de la sourate…</p>
    <div class="ar" style="text-align:center">${esc(Q[r.s-1].ar)}</div>
    <p class="ref" style="text-align:center">${r.s}. ${esc(Q[r.s-1].en)}${cfg.show.v ? ' · ' + Q[r.s-1].a.length + ' versets' : ''}</p>
    <div id="work">${workUI({rev: 'Révéler le verset', voice: '🎤 Réciter le verset', ph: 'اكتب الآية الأولى…'})}</div><div id="fb"></div>`);
}
function startPassage(refs, label, intro, hint = ''){ // passage de plusieurs versets à réciter d'une traite
  cur.r = refs[0]; cur.refs = refs; cur.label = label;
  cur.audio = refs.map(x => x.bas ? {s: 1, a: 1} : x); // la basmala se lit comme le verset 1 de la Fatiha
  setExpected(refs.map(x => ({text: x.bas ? verse({s: 1, a: 1}) : verse(x)})));
  shell(`<p class="ref">${intro}</p><p><b>${esc(label)}</b></p>${hint}
    <div id="work">${workUI({rev: 'Révéler le passage', voice: '🎤 Réciter le passage', ph: 'اكتب المقطع كاملا…', rows: 6})}</div><div id="fb"></div>`);
}
const range = (s, a, n) => Array.from({length: n}, (_, i) => ({s, a: a + i}));
function qCont(){ // passage continu
  const {r} = cur, n = slen(r.s), L = Math.min(cfg.contLen, n), a = Math.min(r.a, n - L + 1);
  const lbl = isQ(r.s) ? `Sourate ${r.s} – ${Q[r.s-1].en}, versets ${a} à ${a + L - 1}` : `${MT[r.s].fr}, ${MT[r.s].unit}s ${a} à ${a + L - 1}`;
  const first = book(r.s).a[a - 1].t.split(/\s+/).slice(0, 2).join(' ');
  startPassage(range(r.s, a, L), lbl, 'Récite de mémoire ce passage, d\'une traite :',
    cfg.show.v ? `<p class="ref">Il commence par : <span class="ar" style="font-size:1.3rem">${esc(first)} …</span></p>` : '');
}
function qEnd(){ // fin de sourate
  const {r} = cur, S = Q[r.s - 1], L = Math.min(cfg.endLen, S.a.length), a = S.a.length - L + 1;
  startPassage(range(r.s, a, L), `Sourate ${r.s} – ${S.en}, versets ${a} à ${S.a.length}`,
    `Récite la fin de la sourate <b>${esc(S.ar)}</b> (${r.s}. ${esc(S.en)}) : ses ${L} dernier${L > 1 ? 's' : ''} verset${L > 1 ? 's' : ''}.`);
}
function qLink(){ // fin d'une sourate + début de la suivante
  const {r} = cur, S = Q[r.s - 1], N = Q[r.s], L1 = Math.min(cfg.endLen, S.a.length), L2 = Math.min(cfg.begLen, N.a.length);
  const a = S.a.length - L1 + 1;
  const bas = N.n !== 9; // la sourate At-Tawba (9) est la seule à ne pas commencer par la basmala
  startPassage([...range(S.n, a, L1), ...(bas ? [{s: N.n, a: 0, bas: true}] : []), ...range(N.n, 1, L2)],
    `${S.n}. ${S.en} ${a}–${S.a.length} → ${N.n}. ${N.en} 1${L2 > 1 ? '–' + L2 : ''}`,
    `Récite la fin de la sourate <b>${esc(S.ar)}</b> (${L1} verset${L1 > 1 ? 's' : ''}) puis le début de la sourate suivante, <b>${esc(N.ar)}</b> (${L2} verset${L2 > 1 ? 's' : ''}). ${bas
      ? 'N\'oublie pas la basmala entre les deux.' : 'La sourate 9 commence sans basmala : enchaîne directement.'}`);
}
function lcsMatch(exp, got, eq = same){ // indices de exp retrouvés dans l'ordre
  const n = exp.length, m = got.length, d = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    d[i][j] = eq(exp[i], got[j]) ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < n && j < m){
    if (eq(exp[i], got[j])){ hit.add(i); i++; j++; }
    else if (d[i+1][j] >= d[i][j+1]) i++; else j++;
  }
  return hit;
}

/* 2. Mots manquants */
function qCloze(){
  const {r} = cur, T = tokenize(verse(r));
  const k = Math.max(1, Math.round(T.idx.length * cfg.level / 100));
  const hidden = new Set(shuffle(T.idx).slice(0, k));
  cur.T = T; cur.hidden = hidden; cur.audio = [r];
  const html = T.tok.map((w, i) => !hidden.has(i) ? esc(w)
    : cfg.input === 'type' ? `<input class="blankin" data-i="${i}" dir="rtl" lang="ar" autocomplete="off">`
    : `<span class="blank" data-act="blank" data-i="${i}">${esc(w)}</span>`).join(' ');
  shell(`<p class="ref">Complète le verset (${k} mot${k > 1 ? 's' : ''} caché${k > 1 ? 's' : ''}).</p>
    <div class="ar">${html}</div>${qref(r)}
    <div id="work">${cfg.input === 'type'
      ? `${kbd()}<button class="pri" data-act="checkcloze">Vérifier</button>`
      : `<button class="pri big" data-act="revealall">Tout révéler</button>`}</div>
    <div id="fb"></div>`);
}

/* 3. Quelle sourate ? */
function qWhich(){
  const {r} = cur; cur.audio = [r];
  let others = ses.pool.map(x => x.s).filter((s, i, a) => s !== r.s && a.indexOf(s) === i && isQ(s) === isQ(r.s));
  if (others.length < 3) others = (isQ(r.s) ? Q.map(s => s.n) : Object.keys(MT)).filter(s => s !== r.s);
  cur.opts = shuffle([r.s, ...shuffle(others).slice(0, 3)]);
  cur.correct = r.s;
  shell(`<p class="ref">${isQ(r.s) ? 'De quelle sourate vient ce verset ?' : 'De quel matn vient ce passage ?'}</p>
    <div class="ar">${esc(verse(r))}</div>
    ${cur.opts.map(s => `<button class="opt" data-act="opt" data-v="${s}">${esc(sname(s))}</button>`).join('')}
    <div id="fb"></div>`);
}

/* 4. QCM suite */
function distractors(good, r, n){
  let src = ses.pool.length >= 12 ? ses.pool : buildPool(isQ(r.s) ? {type: 'all'} : {type: 'matn', id: 'all'});
  src = src.filter(x => isQ(x.s) === isQ(r.s));
  const L = good.length;
  return shuffle(src).slice(0, 40).map(x => verse(x)).filter(t => t !== good && t !== verse(r))
    .sort((a, b) => Math.abs(a.length - L) - Math.abs(b.length - L)).slice(0, n);
}
function qMcq(){
  const {r} = cur, good = verse(nextOf(r));
  cur.audio = [r, nextOf(r)];
  cur.opts = shuffle([good, ...distractors(good, r, 3)]); cur.good = good;
  shell(`<p class="ref">${isQ(r.s) ? 'Quel verset suit celui-ci ?' : 'Quelle est la suite ?'}</p>
    <div class="ar">${esc(verse(r))}</div>${qref(r)}
    ${cur.opts.map((t, i) => `<button class="opt ar" data-act="opt" data-v="${i}">${esc(t)}</button>`).join('')}
    <div id="fb"></div>`);
}

/* 5. Versets proches : les mauvaises réponses sont les suites des versets qui ressemblent */
function qMutash(){
  const {r} = cur, good = verse(nextOf(r)); cur.audio = [r, nextOf(r)];
  const sibs = sibsOf(r).filter(x => x.a < slen(x.s)); cur.sibs = sibs;
  const dis = [...new Set(sibs.map(x => verse(nextOf(x))).filter(t => t !== good))].slice(0, 3);
  if (dis.length < 3) for (const t of distractors(good, r, 6)) if (dis.length < 3 && !dis.includes(t)) dis.push(t);
  cur.opts = shuffle([good, ...dis]); cur.good = good;
  shell(`<p class="ref">Attention, ce verset ressemble à d'autres. Quelle est sa vraie suite ?</p>
    <div class="ar">${esc(verse(r))}</div>${qref(r)}
    ${cur.opts.map((t, i) => `<button class="opt ar" data-act="opt" data-v="${i}">${esc(t)}</button>`).join('')}
    <div id="fb"></div>`);
}
const sibHtml = () => cur.sibs && cur.sibs.length ? `<div class="sib"><span class="ref">Versets proches à ne pas confondre :</span>${cur.sibs.map(x =>
  `<div class="ref" style="margin-top:6px">Sourate ${x.s} – ${esc(Q[x.s-1].en)}, verset ${x.a} (${x.p} % de ressemblance)</div><div class="ar">${esc(verse(x))}</div>`).join('')}</div>` : '';

/* 6. Ordre des sourates */
function qOrder(){
  const {r} = cur; cur.r = {s: r.s, a: 1}; cur.correct = r.s + 1; cur.label = `${r.s}. ${Q[r.s - 1].en} → ${r.s + 1}. ${Q[r.s].en}`;
  const others = shuffle(Q.map(s => s.n).filter(n => n !== r.s + 1 && n !== r.s)).slice(0, 3);
  cur.opts = shuffle([r.s + 1, ...others]);
  shell(`<p class="ref">Quelle sourate vient juste après…</p>
    <div class="ar" style="text-align:center">${esc(Q[r.s-1].ar)}</div><p class="ref" style="text-align:center">${r.s}. ${esc(Q[r.s-1].en)}</p>
    ${cur.opts.map(s => `<button class="opt" data-act="opt" data-v="${s}">${esc(sname(s))}</button>`).join('')}
    <div id="fb"></div>`);
}

/* ---------- actions ---------- */
function onOpt(el){
  if (cur.done) return;
  const btns = [...document.querySelectorAll('.opt')];
  let ok, extra = '';
  if (cur.m === 'which' || cur.m === 'order'){
    const pv = x => isQ(cur.correct) ? +x : x;
    ok = pv(el.dataset.v) === cur.correct;
    btns.forEach(b => { const c = pv(b.dataset.v) === cur.correct ? 'c' : b === el ? 'w' : ''; if (c) b.classList.add(c); });
    extra = ok ? '' : `<br>Bonne réponse : ${esc(sname(cur.correct))}`;
    cur.info = {ans: sname(pv(el.dataset.v))};
  } else {
    ok = cur.opts[+el.dataset.v] === cur.good;
    btns.forEach(b => { const c = cur.opts[+b.dataset.v] === cur.good ? 'c' : b === el ? 'w' : ''; if (c) b.classList.add(c); });
    if (cur.m === 'mutash') extra = sibHtml();
    cur.info = {ans: cur.opts[+el.dataset.v]};
  }
  finish(ok ? 1 : 0, extra);
}
/* correction d'un texte tapé ou entendu */
function evaluate(text, lenient){
  const strict = useStrict() && !lenient; // la voix ne donne pas les voyelles : jamais stricte
  const S = cur.flat.filter(x => x.ok), multi = cur.units.length > 1;
  const got = text.split(/\s+/).map(strict ? ck : norm).filter(Boolean);
  const hit = lcsMatch(S.map(x => strict ? x.sk : x.nw), got, strict ? (a, b) => a === b : same);
  S.forEach((x, i) => { x.hit = hit.has(i); });
  cur.info = {ans: text, bad: S.filter(x => !x.hit).map(x => x.w)};
  cur.badV = cur.units.map((_, v) => S.filter(x => x.v === v && !x.hit).map(x => x.w));
  const ratio = hit.size / S.length, perfect = hit.size === S.length && got.length === S.length;
  const score = strict ? (perfect ? 1 : 0)
    : multi ? (ratio === 1 ? 1 : ratio >= 0.85 ? 0.5 : 0)
    : ratio >= (lenient ? 0.8 : 0.9) ? 1 : ratio >= (lenient ? 0.5 : 0.6) ? 0.5 : 0;
  $('work').innerHTML = `<div class="ar">${flatHtml(x => `<span class="${x.hit ? 'w-ok' : 'w-ko'}">${esc(x.w)}</span>`)}</div>`;
  let extra = lenient ? `<br><span class="ref">Entendu : ${esc(text)}</span>` : '';
  if (multi){
    const per = cur.units.map((_, v) => { const w = S.filter(x => x.v === v), h = w.filter(x => x.hit).length;
      return h === w.length ? 1 : (!strict && h / w.length >= 0.85) ? 0.5 : 0; });
    cur.perRef = cur.refs.map((x, v) => [x, per[v]]);
    const bad = per.findIndex(s => s < 1);
    if (bad >= 0) extra += `<br><span class="ref">Premier écart : ${cur.refs[bad].bas ? 'la basmala' : (cur.refs[bad].s !== cur.refs[0].s ? 'sourate ' + cur.refs[bad].s + ', ' : '') + 'verset ' + cur.refs[bad].a} · ${per.filter(s => s < 1).length} partie(s) à revoir.</span>`;
  } else if (strict && !score) extra += '<br><span class="ref">Correction stricte : tout doit être exact (en rouge : mots faux ou manquants).</span>';
  finish(score, extra);
}
function onCheckCloze(){
  let good = 0; const strict = useStrict(), bad = [], given = [];
  document.querySelectorAll('.blankin').forEach(inp => {
    const i = +inp.dataset.i, ok = strict ? ck(inp.value) === cur.T.sk[i] : same(norm(inp.value), cur.T.nw[i]);
    if (ok) good++; else { bad.push(cur.T.tok[i]); given.push(inp.value.trim() || '∅'); }
    inp.outerHTML = `<span class="${ok ? 'w-ok' : 'w-ko'}">${esc(cur.T.tok[i])}</span>`;
  });
  $('work').innerHTML = '';
  cur.info = {ans: given.join(' | '), bad};
  finish(strict ? (good === cur.hidden.size ? 1 : 0) : good / cur.hidden.size);
}
/* récitation puis marquage mot à mot des erreurs */
function markUI(){
  return `<div class="ar" id="marks">${flatHtml((x, i) => `<span class="wd" data-act="wd" data-i="${i}">${esc(x.w)}</span>`)}</div>
    <p class="ref">Touche les mots que tu as faux ou oubliés.</p>
    <div class="grades"><button data-act="mark-ok">✓ Tout juste</button><button data-act="mark-mid">~ J'ai hésité</button>
    <button class="pri" id="mark-go" data-act="mark-go">Valider (0 erreur)</button></div>`;
}
function markGo(){
  const bad = [...document.querySelectorAll('.wd.bad')].map(e => +e.dataset.i), tot = cur.flat.filter(x => x.ok).length;
  const strict = useStrict();
  const score = bad.length === 0 ? 1 : strict ? 0 : bad.length / tot <= 0.1 ? 0.5 : 0;
  cur.info = {bad: bad.map(i => cur.flat[i].w)};
  cur.badV = cur.units.map((_, v) => bad.filter(i => cur.flat[i].v === v).map(i => cur.flat[i].w));
  if (cur.units.length > 1){
    cur.perRef = cur.refs.map((x, v) => { const w = cur.flat.map((f, i) => [f, i]).filter(([f]) => f.v === v && f.ok), b = w.filter(([, i]) => bad.includes(i)).length;
      return [x, b === 0 ? 1 : (!strict && b / w.length <= 0.1) ? 0.5 : 0]; });
  }
  $('work').innerHTML = `<div class="ar">${flatHtml((x, i) => `<span class="${bad.includes(i) ? 'w-ko' : 'w-ok'}">${esc(x.w)}</span>`)}</div>`;
  finish(score);
}

/* ---------- voix (Web Speech API, arabe) ---------- */
function listen(){
  if (cur.done) return;
  const cont = cur.m === 'cont';
  const btn = document.querySelector('[data-act="listen"]'), heard = $('heard');
  const rec = new SR(); rec.lang = 'ar-SA'; rec.interimResults = cont; rec.continuous = cont; rec.maxAlternatives = 1;
  let text = '', stopping = false;
  rec.onresult = ev => {
    text = [...ev.results].map(r => r[0].transcript).join(' ');
    if (cont) heard.textContent = text;
  };
  rec.onerror = ev => { heard.textContent = 'Micro indisponible (' + ev.error + ').'; };
  rec.onend = () => {
    btn.disabled = false; btn.textContent = '🎤 Réessayer'; btn.onclick = null;
    if (text.trim()) evaluate(text, true); else if (!heard.textContent) heard.textContent = 'Rien entendu, réessaie.';
  };
  heard.textContent = '';
  btn.textContent = cont ? '⏹ J\'ai fini de réciter' : '🎙️ Je t\'écoute… récite la suite';
  if (cont){ btn.onclick = ev => { ev.stopPropagation(); if (!stopping){ stopping = true; rec.stop(); } }; } else btn.disabled = true;
  try { rec.start(); } catch { btn.disabled = false; }
}

let rd = null;

/* ---------- historique des erreurs ---------- */
let hf = 'all', hv = 'v', hrefs = [];
const MODE_NAME = Object.fromEntries(MODES.map(([id, t]) => [id, t]));
const fdate = t => new Date(t).toLocaleString('fr-FR', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
function aggErrors(list){
  const agg = new Map();
  for (const e of list){
    const r = pk(e.k); if (!book(r.s)) continue;
    const a = agg.get(e.k) || {k: e.k, r, n: 0, last: 0, modes: new Set(), bad: []};
    a.n++; a.last = Math.max(a.last, e.t); a.modes.add(MODE_NAME[e.m] || e.m);
    (e.bad || []).forEach(w => { if (!a.bad.includes(w)) a.bad.push(w); });
    agg.set(e.k, a);
  }
  return [...agg.values()].sort((x, y) => y.n - x.n || y.last - x.last);
}
function tabErrors(){
  const lim = Date.now() - 7 * 864e5;

  const rows = aggErrors(L); hrefs = rows.slice(0, 15).map(a => a.r);
  const chip = (id, cur_, t, act) => `<button class="${cur_ === id ? 'sel' : ''}" data-act="${act}" data-v="${id}">${t}</button>`;
  const body = hv === 'v'
    ? rows.slice(0, 80).map(a => `<div class="sib"><p class="ref" style="margin:0">${rlabel(a.r)}</p>

        return `<div class="sib"><p class="ref" style="margin:0">${fdate(e.t)} · ${esc(MODE_NAME[e.m] || e.m)} · ${e.sc === 0.5 ? 'hésité' : 'raté'}</p>
        <p class="ref" style="margin:0"><b>${rlabel(r)}</b></p>
        ${e.bad ? `<p class="ref" style="margin:0">Mots faux ou oubliés : <span class="ar" style="font-size:1.2rem;display:inline">${esc(e.bad.join(' · '))}</span></p>` : ''}
        ${e.ans ? `<p class="ref" style="margin:0">Ta réponse : <span class="ar" style="font-size:1.2rem;display:inline">${esc(e.ans)}</span></p>` : ''}</div>`; }).join('');
  return `

  <p class="sub">${L.length} erreur${L.length > 1 ? 's' : ''} · ${rows.length} verset${rows.length > 1 ? 's' : ''} concerné${rows.length > 1 ? 's' : ''}</p>

}

async function forceUpdate(el){
  if (!navigator.onLine) return alert('Pas de connexion : connecte-toi à internet pour mettre à jour.');
  el.disabled = true; el.textContent = 'Mise à jour…';
  try { // vide uniquement les fichiers de l'application en cache : la progression (localStorage) n'est pas touchée
    const regs = (await navigator.serviceWorker?.getRegistrations?.()) || [];
    await Promise.all(regs.map(r => r.unregister()));
    await Promise.all((await caches.keys()).map(k => caches.delete(k)));
  } catch {}
  location.reload();
}
const CLOUD = window.HIFZ_CLOUD || {};
const cloudOn = () => !!(CLOUD.url && CLOUD.anonKey);

const SYNC_KEYS = ['hifz.cfg', 'hifz.stats', 'hifz.sched', 'hifz.days', 'hifz.errors', 'hifz.custom'];

cloudDirty = k => {
  if (syncPause || !me || !SYNC_KEYS.includes(k)) return;
  store.set('hifz.cloud', {...cmeta(), dirty: true});
  clearTimeout(pushTimer); pushTimer = setTimeout(cloudPush, 3000);

function friendly(e){
  const m = String(e?.message || e || '');
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(m)) return 'Confirme d\'abord ton e-mail : clique le lien reçu par mail.';
  if (/already registered|already been registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail : connecte-toi.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Trop de tentatives : réessaie dans quelques minutes.';
  if (/Password should|weak password/i.test(m)) return 'Mot de passe trop faible (8 caractères minimum).';
  if (/does not exist|schema cache|Could not find/i.test(m)) return 'La base n\'est pas prête : exécute supabase/schema.sql dans Supabase.';
  if (/Failed to fetch|NetworkError|Load failed|hors ligne/i.test(m)) return 'Connexion impossible : vérifie ta connexion internet.';
  if (/accès refusé|42501|permission denied|row-level security/i.test(m)) return 'Action refusée (droits insuffisants).';
  return m || 'Erreur inconnue.';
}
function loadSupabase(){
  return new Promise((res, rej) => {
    if (window.supabase) return res();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js';
    sc.integrity = 'sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp'; sc.crossOrigin = 'anonymous';
    sc.onload = res; sc.onerror = () => rej(new Error('Bibliothèque de compte indisponible (hors ligne ?)'));
    document.head.appendChild(sc);
  });
}
let authReady = !cloudOn(); // sans comptes configurés, l'accès est libre ; sinon on attend de savoir si une session existe
async function cloudInit(){
  try { await loadSupabase(); } catch (e){ acc.msg = friendly(e); authReady = true; return home(); }
  sb = window.supabase.createClient(CLOUD.url, CLOUD.anonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  sb.auth.onAuthStateChange((ev, sess) => setTimeout(async () => { // jamais d'appel Supabase directement dans ce rappel
    if (!authReady) return;
    if (ev === 'SIGNED_OUT'){ me = null; refreshAccount(); return; }
    if (ev === 'PASSWORD_RECOVERY'){ await loadMe(sess); acc.mode = 'newpass'; openAccount('newpass'); return; }
    if (sess && ev === 'SIGNED_IN' && !me) await loadMe(sess);
  }, 0));
  try { const {data: {session}} = await sb.auth.getSession(); if (session) await loadMe(session); } catch {}
  authReady = true; home();
}
function renderLoading(){ setNav(false); $app.innerHTML = '<p class="sub" style="margin-top:40vh;text-align:center">Chargement…</p>'; }
function refreshAccount(){
  if (screen === 'account' && me && acc.fromGate){ acc.fromGate = false; return go('home'); } // connexion réussie depuis l'écran d'accueil protégé
  if (screen === 'account') renderAccount(); else if (screen === 'admin') renderAdmin(); else if (screen === 'tab' || !me) home();
}
async function loadMe(sess){
  if (!sess || loadingMe) return; loadingMe = true;
  try {
    const u = sess.user, {data: prof, error} = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
    if (error) throw error;
    if (!prof) throw new Error('relation profiles does not exist (profil introuvable)');
    if (prof.blocked){ await sb.auth.signOut(); me = null; acc.msg = 'Ce compte est suspendu.'; acc.ok = false; return; }
    me = {user: {id: u.id, email: u.email}, profile: prof}; store.set('hifz.me', me);
    sb.rpc('touch');
    await cloudSyncOnLogin();
  } catch (e){
    const c = store.get('hifz.me', null); // hors ligne : on reprend le dernier profil connu de cette session
    if (c && sess && c.user.id === sess.user.id && /Failed to fetch|NetworkError|Load failed/i.test(String(e && e.message))) me = c;
    else { acc.msg = friendly(e); acc.ok = false; }
  }
  finally { loadingMe = false; refreshAccount(); }
}

/* synchronisation : un document JSON par utilisateur */
function snap(){ const c = {...cfg}; delete c.tab; return {v: 1, cfg: c, stats, sched, days, errors, custom}; }
const hasLocal = () => Object.keys(stats).length > 0 || errors.length > 0 || custom.length > 0;
function applyRemote(d){
  syncPause = true;
  try {
    stats = d.stats || {}; sched = d.sched || {}; days = d.days || {}; errors = d.errors || [];
    custom.forEach(t => { delete MT[t.id]; }); custom = d.custom || []; custom.forEach(t => { MT[t.id] = t; });
    if (d.cfg){ const keep = cfg.tab; Object.assign(cfg, d.cfg); cfg.tab = keep; }
    store.set('hifz.stats', stats); store.set('hifz.sched', sched); store.set('hifz.days', days);
    store.set('hifz.errors', errors); store.set('hifz.custom', custom); saveCfg();
  } finally { syncPause = false; }
}
function mergeData(a, b){ // a = cet appareil, b = compte : on ne perd rien
  const st = {...(b.stats || {})};
  for (const [k, [o, e]] of Object.entries(a.stats || {})){ const x = st[k] || [0, 0]; st[k] = [Math.max(o, x[0]), Math.max(e, x[1])]; }
  const sc = {...(b.sched || {})}; for (const [k, v] of Object.entries(a.sched || {})) if (!sc[k] || v.due > sc[k].due) sc[k] = v;
  const dy = {...(b.days || {})}; for (const [k, n] of Object.entries(a.days || {})) dy[k] = Math.max(n, dy[k] || 0);
  const seen = new Set();
  const er = [...(b.errors || []), ...(a.errors || [])].filter(e => { const id = e.t + ':' + e.k; if (seen.has(id)) return false; seen.add(id); return true; })
    .sort((x, y) => x.t - y.t).slice(-2000);
  const cu = new Map(); [...(b.custom || []), ...(a.custom || [])].forEach(t => cu.set(t.id, t));
  return {...b, cfg: a.cfg || b.cfg, stats: st, sched: sc, days: dy, errors: er, custom: [...cu.values()]};
}
async function cloudPush(){
  if (!me || !sb) return;
  try {
    const t = new Date().toISOString();
    const {error} = await sb.from('user_data').upsert({user_id: me.user.id, data: snap(), updated_at: t});
    if (error) throw error;
    store.set('hifz.cloud', {uid: me.user.id, t, dirty: false}); acc.last = t; acc.syncErr = '';
  } catch (e){ acc.syncErr = friendly(e); }
  if (screen === 'account') renderAccount();
}
async function cloudSyncOnLogin(){
  const meta = cmeta(), uid = me.user.id;
  const {data: remote, error} = await sb.from('user_data').select('data,updated_at').eq('user_id', uid).maybeSingle();
  if (error) throw error;
  const stamp = () => { acc.last = new Date().toISOString(); store.set('hifz.cloud', {uid, t: acc.last, dirty: false}); };
  if (!remote){ if (hasLocal()) await cloudPush(); else stamp(); return; }
  if (meta.uid === uid){
    if (meta.dirty) await cloudPush();                                                // modifications locales non envoyées : elles gagnent
    else if (!meta.t || Date.parse(remote.updated_at) > Date.parse(meta.t)){ applyRemote(remote.data); stamp(); }
    else acc.last = meta.t;
  } else if (!hasLocal()){ applyRemote(remote.data); stamp(); }
  else { applyRemote(mergeData(snap(), remote.data)); await cloudPush(); acc.msg = 'La progression de cet appareil a été fusionnée avec celle de ton compte.'; acc.ok = true; }
}

const val = id => ($(id)?.value || '').trim();
const okEmail = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
async function busy(fn){ if (acc.busy) return; acc.busy = true; acc.msg = ''; try { await fn(); acc.d.pass = acc.d.pass2 = ''; acc.d.consent = false; } catch (e){ acc.msg = friendly(e); acc.ok = false; } finally { acc.busy = false; if (screen === 'account') renderAccount(); } }
const keepEmail = () => { acc.d = {email: val('ac-email') || acc.d.email, pass: $('ac-pass')?.value ?? acc.d.pass, pass2: $('ac-pass2')?.value ?? acc.d.pass2, consent: !!$('ac-consent')?.checked}; };
const doLogin = () => busy(async () => {
  keepEmail(); const email = val('ac-email'), password = $('ac-pass').value;
  if (!okEmail(email) || !password) throw new Error('Indique ton e-mail et ton mot de passe.');
  const {data, error} = await sb.auth.signInWithPassword({email, password}); if (error) throw error;
  await loadMe(data.session);
});
const doSignup = () => busy(async () => {
  keepEmail(); const email = val('ac-email'), pw = $('ac-pass').value;
  if (!okEmail(email)) throw new Error('Adresse e-mail invalide.');
  if (pw.length < 8) throw new Error('Le mot de passe doit faire 8 caractères au moins.');
  if (pw !== $('ac-pass2').value) throw new Error('Les deux mots de passe ne correspondent pas.');
  if (!$('ac-consent').checked) throw new Error('Coche la case pour accepter l\'enregistrement de tes données.');
  const {data, error} = await sb.auth.signUp({email, password: pw, options: {emailRedirectTo: REDIRECT()}}); if (error) throw error;
  if (data.user && data.user.identities && data.user.identities.length === 0) throw new Error('Un compte existe déjà avec cet e-mail : connecte-toi.');
  if (data.session){ await loadMe(data.session); acc.msg = 'Compte créé.'; acc.ok = true; return; }
  acc.mode = 'login'; acc.ok = true; acc.msg = `Compte créé. Un e-mail de confirmation a été envoyé à ${email} : clique le lien, puis connecte-toi.`;
});
const doReset = () => busy(async () => {
  keepEmail(); const email = val('ac-email'); if (!okEmail(email)) throw new Error('Adresse e-mail invalide.');
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: REDIRECT()}); if (error) throw error;
  acc.mode = 'login'; acc.ok = true; acc.msg = 'Si un compte existe pour cette adresse, un lien de réinitialisation vient d\'être envoyé.';
});
const doNewPass = () => busy(async () => {
  const pw = $('ac-pass').value; if (pw.length < 8) throw new Error('Le mot de passe doit faire 8 caractères au moins.');
  const {error} = await sb.auth.updateUser({password: pw}); if (error) throw error;
  acc.mode = 'login'; acc.ok = true; acc.msg = 'Mot de passe mis à jour.';
});
const doSync = () => busy(async () => { await cloudSyncOnLogin(); await cloudPush(); if (!acc.syncErr){ acc.ok = true; acc.msg = 'Synchronisé.'; } });
const doLogout = async () => {
  if (!confirm('Te déconnecter ? La progression de cet appareil sera effacée (elle reste dans ton compte).')) return;
  clearTimeout(pushTimer); await cloudPush();
  if (acc.syncErr && !confirm('La dernière synchronisation a échoué : te déconnecter perdra les changements non envoyés. Continuer ?')) return;
  await sb.auth.signOut(); me = null; try { localStorage.removeItem('hifz.me'); } catch {}
  syncPause = true; stats = {}; sched = {}; days = {}; errors = []; custom.forEach(t => { delete MT[t.id]; }); custom = [];
  ['hifz.stats', 'hifz.sched', 'hifz.days', 'hifz.errors', 'hifz.custom', 'hifz.cloud'].forEach(k => { try { localStorage.removeItem(k); } catch {} });
  syncPause = false; acc.msg = 'Déconnecté.'; acc.ok = true; acc.mode = 'login'; renderAccount();
};
const doDeleteMe = () => busy(async () => {
  if (!confirm('Supprimer définitivement ton compte et ta progression enregistrée ? Cette action est irréversible.')) return;
  const {error} = await sb.rpc('delete_me'); if (error) throw error;
  await sb.auth.signOut(); me = null; try { localStorage.removeItem('hifz.cloud'); localStorage.removeItem('hifz.me'); } catch {}
  acc.mode = 'login'; acc.ok = true; acc.msg = 'Compte supprimé. La progression de cet appareil est conservée.';
});

/* espace admin : l'interface n'est qu'un affichage, les droits sont vérifiés par la base (voir supabase/schema.sql) */
const when = t => t ? fdate(Date.parse(t)) : '—';
function summarize(d){
  const st = d.stats || {}; let ok = 0, tot = 0; const per = {};
  for (const [k, [o, e]] of Object.entries(st)){ ok += o; tot += o + e; const s = k.split(':')[0]; (per[s] ||= [0, 0]); per[s][0] += o; per[s][1] += e; }
  const weak = Object.entries(per).filter(([, [o, e]]) => o + e >= 3).map(([s, [o, e]]) => [s, o / (o + e)]).sort((a, b) => a[1] - b[1]).slice(0, 5);
  const wk = Object.entries(d.days || {}).filter(([k]) => Date.parse(k) >= Date.now() - 7 * 864e5).reduce((a, [, n]) => a + n, 0);
  return {tot, ok, seen: Object.keys(st).length, weak, wk, last: (d.errors || []).slice(-5).reverse()};
}
async function openAdmin(){ if (!isAdmin()) return; adm.detail = null; adm.users = null; renderAdmin(); window.scrollTo(0, 0); await adminLoad(); }
async function adminLoad(){
  adm.msg = '';
  try { const {data, error} = await sb.rpc('admin_users'); if (error) throw error; adm.users = data; } catch (e){ adm.msg = friendly(e); }
  renderAdmin();
}
function renderAdmin(){
  setNav(false); screen = 'admin';
  const list = (adm.users || []).filter(u => !adm.q || u.email.toLowerCase().includes(adm.q.toLowerCase()));
  const active = (adm.users || []).filter(u => u.last_seen && Date.parse(u.last_seen) > Date.now() - 7 * 864e5).length;
  const row = u => {
    const self = me && u.id === me.user.id, rate = Number(u.answers) ? Math.round(100 * u.ok / u.answers) + ' %' : '—';
    const d = adm.detail && adm.detail.id === u.id ? adm.detail.data : null;
    let det = '';
    if (d === false) det = '<p class="ref">Pas encore de progression enregistrée.</p>';
    else if (d){ const x = summarize(d); det = `<div class="sib"><p class="ref" style="margin:0">${Math.round(x.tot)} réponses · ${x.tot ? Math.round(100 * x.ok / x.tot) : 0} % · ${x.seen} versets vus · ${Math.round(x.wk)} réponses sur 7 jours</p>
      ${x.weak.length ? `<p class="ref" style="margin:4px 0 0"><b>À retravailler :</b> ${x.weak.map(([s, r]) => `${esc(book(/^\d+$/.test(s) ? +s : s) ? sname(/^\d+$/.test(s) ? +s : s) : s)} (${Math.round(r * 100)} %)`).join(' · ')}</p>` : ''}
      ${x.last.length ? `<p class="ref" style="margin:4px 0 0"><b>Dernières erreurs :</b></p>${x.last.map(e => { const r = pk(e.k); return book(r.s) ? `<p class="ref" style="margin:0">${fdate(e.t)} · ${rlabel(r)}</p>` : ''; }).join('')}` : ''}</div>`; }
    return `<div class="sib"><p style="margin:0"><b>${esc(u.email)}</b> ${u.role === 'admin' ? '<span class="ref">· 🛡 admin</span>' : ''}${u.blocked ? '<span class="ref" style="color:var(--ko)"> · suspendu</span>' : ''}${self ? '<span class="ref"> · toi</span>' : ''}</p>
      <p class="ref" style="margin:0">Inscrit le ${when(u.created_at)} · actif ${when(u.last_seen)} · ${Math.round(u.answers)} réponses · réussite ${rate} · ${u.errors} erreurs</p>
      <div class="grades"><button data-act="adm-detail" data-v="${u.id}">${adm.detail && adm.detail.id === u.id ? 'Masquer' : 'Progression'}</button>
        <button data-act="adm-role" data-v="${u.id}" ${self ? 'disabled' : ''}>${u.role === 'admin' ? 'Retirer admin' : 'Nommer admin'}</button>
        <button data-act="adm-block" data-v="${u.id}" ${self ? 'disabled' : ''}>${u.blocked ? 'Débloquer' : 'Bloquer'}</button>
        <button data-act="adm-del" data-v="${u.id}" style="color:var(--ko)" ${self ? 'disabled' : ''}>Supprimer</button></div>${det}</div>`;
  };
  $app.innerHTML = `<div class="top"><button class="link" data-act="acc-back">← Retour</button><span>Administration</span></div>
    <h1 style="margin-top:8px">Espace admin</h1>
    <p class="sub">${adm.users ? `${adm.users.length} compte${adm.users.length > 1 ? 's' : ''} · ${active} actif${active > 1 ? 's' : ''} sur 7 jours` : 'Chargement…'}</p>
    ${adm.msg ? `<div class="fb ko">${esc(adm.msg)}</div>` : ''}
    <div class="row" style="margin-bottom:10px"><input type="text" id="adm-q" placeholder="Rechercher un e-mail" value="${esc(adm.q)}" autocomplete="off"><button data-act="adm-refresh" style="flex:0 0 auto">🔄 Actualiser</button></div>
    <div class="card">${adm.users ? (list.map(row).join('') || '<p class="sub" style="margin:0">Aucun compte.</p>') : ''}</div>`;
  const q = $('adm-q'); if (q) q.oninput = () => { adm.q = q.value; const pos = q.selectionStart; renderAdmin(); const n = $('adm-q'); n.focus(); n.setSelectionRange(pos, pos); };
}
async function adminDetail(id){
  if (adm.detail && adm.detail.id === id){ adm.detail = null; return renderAdmin(); }
  try { const {data, error} = await sb.rpc('admin_user_data', {target: id}); if (error) throw error; adm.detail = {id, data: data || false}; adm.msg = ''; }
  catch (e){ adm.msg = friendly(e); }
  renderAdmin();
}
async function adminAct(fn, okMsg){
  try { const {error} = await fn(); if (error) throw error; adm.msg = ''; } catch (e){ adm.msg = friendly(e); }
  await adminLoad();
}
const userOf = id => (adm.users || []).find(u => u.id === id);
function adminRole(id){ const u = userOf(id); if (!u) return;
  const to = u.role === 'admin' ? 'user' : 'admin';
  if (confirm(`${to === 'admin' ? 'Nommer administrateur' : 'Retirer le rôle admin à'} ${u.email} ?`)) adminAct(() => sb.rpc('admin_set_role', {target: id, new_role: to})); }
function adminBlock(id){ const u = userOf(id); if (!u) return;
  if (confirm(`${u.blocked ? 'Débloquer' : 'Bloquer'} ${u.email} ?`)) adminAct(() => sb.rpc('admin_set_blocked', {target: id, b: !u.blocked})); }
function adminDelete(id){ const u = userOf(id); if (!u) return;
  if (confirm(`Supprimer définitivement le compte ${u.email} et toute sa progression ? Irréversible.`)) adminAct(() => sb.rpc('admin_delete_user', {target: id})); }
$app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); $(e.target.dataset.enter)?.click(); } });

/* ---------- démarrage ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
(async function init(){
  MT = Object.fromEntries((window.MOUTOUN?.texts || []).map(t => [t.id, t]));
  custom.forEach(t => { MT[t.id] = t; });
  try { await loadQuran(); if (cloudOn()){ renderLoading(); await cloudInit(); } else home(); }
  catch (err){
    $app.innerHTML = `<h1>Chargement impossible</h1>
      <p class="sub">Une connexion internet est nécessaire au premier lancement (${esc(err.message)}).</p>
      <button class="pri" onclick="location.reload()">Réessayer</button>`;
  }
})();
</script>
